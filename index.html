<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beyond the Blue and White — A Digital Map</title>
  <meta name="description" content="A free multimedia digital map of Black history at UNC Chapel Hill, with the sites, events, and people significant to that history across campus, and resources for learning more.">
  <meta name="theme-color" content="#172849">
  <link rel="icon" href="images/icons/pins/memorial.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/gasoek-one-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lato-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lato-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="js/vendor/leaflet/leaflet.css?v=ec929f11">
  <link rel="stylesheet" href="css/styles.css?v=e2e354d8">
</head>
<body class="is-loading">
  <a class="skip-link" href="#main">Skip to map content</a>

  <!-- Splash: shown while the map's data loads -->
  <div id="splash" class="splash" role="status" aria-live="polite">
    <img src="images/logo/btbb-stacked-carolinablue.svg" alt="Beyond the Blue and White" class="splash-logo" width="280" height="170">
    <span class="visually-hidden">Loading the map…</span>
  </div>

  <header class="app-header" hidden>
    <h1 class="brand">
      <button type="button" id="brand-home" class="brand-btn" aria-label="Beyond the Blue and White — home">
        <img src="images/logo/btbb-horizontal-navy.svg" alt="" class="brand-logo" width="1158" height="79">
      </button>
    </h1>
    <nav class="header-nav" aria-label="Main">
      <!-- Phones: one menu button; the links open in a drop-down. Desktop: the links show in the header. -->
      <button type="button" id="menu-btn" class="nav-link menu-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Menu">
        <svg class="menu-icon" aria-hidden="true" viewBox="0 0 24 24" width="26" height="26"><path class="menu-open" d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path class="menu-close" d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <div id="nav-menu" class="nav-menu">
        <button type="button" id="view-map" class="nav-link" aria-pressed="true">
          <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4Zm0 0v14m6-12v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span class="nav-text">Map</span>
        </button>
        <button type="button" id="view-list" class="nav-link" aria-pressed="false">
          <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.6" fill="currentColor"/><circle cx="4.5" cy="12" r="1.6" fill="currentColor"/><circle cx="4.5" cy="18" r="1.6" fill="currentColor"/></svg>
          <span class="nav-text">All sites</span>
        </button>
        <button type="button" id="view-people" class="nav-link" aria-pressed="false">
          <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><circle cx="9" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.8 19.5c.6-3.6 3-5.6 6.2-5.6s5.6 2 6.2 5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15.6 4.9a3.3 3.3 0 0 1 0 6.3M17.8 14.3c1.9.7 3.1 2.4 3.5 5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="nav-text">People</span>
        </button>
        <button type="button" id="view-about" class="nav-link" aria-pressed="false">
          <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 10.6v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="7.4" r="1.35" fill="currentColor"/></svg>
          <span class="nav-text">About</span>
        </button>
      </div>
    </nav>
  </header>

  <main id="main">
    <!-- Intro / home screen -->
    <section id="intro-view" class="view intro-view" aria-labelledby="intro-heading" hidden>
      <div class="intro-inner">
        <h2 id="intro-heading" class="intro-logo">
          <img src="images/logo/btbb-stacked-carolinablue.svg" alt="Beyond the Blue and White" width="280" height="170">
        </h2>
        <p id="intro-eyebrow" class="intro-eyebrow"></p>
        <p id="intro-text" class="intro-text"></p>
        <button type="button" id="intro-cta" class="cta">Explore the map</button>
      </div>
    </section>

    <section id="map-view" class="view" aria-label="Map" hidden>
      <div id="map" role="application" aria-label="Map of sites. Tab to reach the pins; press Enter to open a site."></div>

      <div class="map-tools">
        <button type="button" id="locate-btn" class="round-btn" aria-label="Show where I am" title="Show where I am">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.07A7 7 0 0 0 13 5.07V3h-2v2.07A7 7 0 0 0 5.07 11H3v2h2.07A7 7 0 0 0 11 18.93V21h2v-2.07A7 7 0 0 0 18.93 13H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
        </button>
      </div>

      <div id="map-hint" class="map-hint" hidden>
        <p id="map-hint-text" class="map-hint-text"></p>
        <ul id="map-legend" class="map-legend" aria-label="Map key"></ul>
      </div>
    </section>

    <section id="list-view" class="view page-view" aria-labelledby="list-heading" hidden>
      <div class="page-inner">
        <h2 id="list-heading">All sites</h2>
        <p id="tour-intro" class="page-intro"></p>
        <ol id="stop-list" class="stop-list"></ol>
      </div>
    </section>

    <section id="people-view" class="view page-view" aria-labelledby="people-page-heading" hidden>
      <div class="page-inner">
        <h2 id="people-page-heading">People</h2>
        <p class="page-intro">The people highlighted at the sites on this map. Choose a site name to read their story there.</p>
        <ul id="people-list" class="people people-index"></ul>
      </div>
    </section>

    <section id="about-view" class="view page-view" aria-labelledby="about-heading" hidden>
      <div class="page-inner about">
        <h2 id="about-heading">About this project</h2>
        <div id="about-body"></div>
      </div>
    </section>
  </main>

  <aside id="panel" class="panel" aria-labelledby="panel-title" hidden>
    <div class="panel-top">
      <button type="button" id="panel-expand" class="handle" aria-expanded="false" aria-controls="panel-body">
        <svg class="swipe-hint" aria-hidden="true" viewBox="0 0 24 12" width="28" height="14"><path d="M3 10l9-7 9 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="handle-bar" aria-hidden="true"></span>
        <span class="visually-hidden" id="panel-expand-label">Show the full story</span>
      </button>
      <button type="button" id="panel-close" class="close-btn" aria-label="Close site details">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <h2 id="panel-title" class="panel-title">
        <span id="panel-name" class="stop-name"></span>
      </h2>
      <p id="panel-era" class="era"></p>
      <!-- Phones, peek view only: a strip of the site's hero photo (the gallery shows it in full). -->
      <div id="peek-hero" class="peek-hero" aria-hidden="true" hidden><img alt="" decoding="async"></div>
    </div>

    <div class="panel-body" id="panel-body" tabindex="-1">
      <div id="gallery" class="gallery"></div>

      <p id="panel-summary" class="summary"></p>
      <div id="panel-history" class="history"></div>

      <section id="sources-section" aria-labelledby="sources-heading">
        <h3 id="sources-heading" class="section-heading">Sources</h3>
        <ol id="panel-sources" class="sources"></ol>
      </section>

      <section id="people-section" aria-labelledby="people-heading">
        <h3 id="people-heading" class="section-heading">Key people</h3>
        <ul id="panel-people" class="people"></ul>
      </section>

      <nav class="panel-nav" aria-label="Site navigation">
        <a id="directions-link" class="directions" href="#" target="_blank" rel="noopener">Get walking directions</a>
        <div class="prev-next">
          <button type="button" id="prev-btn" class="nav-btn">‹ Previous</button>
          <button type="button" id="next-btn" class="nav-btn primary">Next ›</button>
        </div>
      </nav>
    </div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p class="noscript">This map needs JavaScript to show the sites.</p>
  </noscript>

  <script src="js/vendor/leaflet/leaflet.js?v=5a640ff8"></script>
  <script src="js/app.js?v=fd43ea17"></script>
</body>
</html>
